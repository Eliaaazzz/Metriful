spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cache:
    type: simple
  data:
    redis:
      host: localhost
      port: 6379

app:
  api-key: test-api-key-123  # Used for API Key authentication
  seed:
    enabled: false
  openai:
    enabled: false
    api-key: ""
    model: gpt-4o
    meal-model: gpt-4o
    timeout-seconds: 60
    cost-per-thousand-tokens: 10.0
    log-usage: false
  google:
    client-id: ""
  apple:
    client-id: ""
  youtube:
    api-key: ""
    quota:
      warnings-enabled: false
      alert-percent: 80
  spoonacular:
    api-key: ""
  gemini:
    api-key: ""
    model: gemini-2.5-flash
  jwt:
    secret: test-secret-key-that-is-long-enough-for-256-bits-for-jwt
    expiration-days: 30
  meal-plan:
    cache-ttl-hours: 24
  recipe-generation:
    cache-ttl-hours: 24

r2:
  endpoint: http://localhost:9000
  access-key: test-access-key
  secret-key: test-secret-key
  bucket: test-bucket
  public-url: https://example.invalid

usda:
  enabled: true
  api-key: ""
  base-url: https://api.nal.usda.gov/fdc
  cache:
    l1:
      maximum-size: 2000
      expire-after-write: 12h
    l2:
      ttl: 7d

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.fitnessapp.backend: INFO
    org.springframework.security: DEBUG
