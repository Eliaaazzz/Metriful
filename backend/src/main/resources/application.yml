spring:
  application:
    name: fitness-app
  profiles:
    default: dev
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  data:
    redis:
      repositories:
        enabled: false
  cache:
    type: caffeine

usda:
  enabled: ${USDA_ENABLED:true}
  api-key: ${USDA_API_KEY:}
  base-url: https://api.nal.usda.gov/fdc
  cache:
    l1:
      maximum-size: 2000
      expire-after-write: 12h
    l2:
      ttl: 7d

# Cloudflare R2 Storage
r2:
  endpoint: ${R2_ENDPOINT:http://localhost:9000}
  access-key: ${R2_ACCESS_KEY:test-access-key}
  secret-key: ${R2_SECRET_ACCESS_KEY:test-secret-key}
  bucket: ${R2_BUCKET_NAME:aurafit}
  public-url: ${R2_PUBLIC_URL:https://media.aurafitness.com}

app:
  api-key: ${API_KEY:${APP_API_KEY:fitness-secret-key-123}}  # API Key for request authentication (X-API-Key header)
  cookie:
    # For web (cookie-based auth). In cross-site deployments (frontend on a different
    # domain/subdomain than the API), set same-site to "None" and provide a domain.
    # These can be overridden by environment variables:
    #   APP_COOKIE_SECURE=true|false
    #   APP_COOKIE_SAME_SITE=None|Lax|Strict
    #   APP_COOKIE_DOMAIN=.aurafitness.org
    secure: ${APP_COOKIE_SECURE:true}
    same-site: ${APP_COOKIE_SAME_SITE:Strict}
    domain: ${APP_COOKIE_DOMAIN:}
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
    ingestion-enabled: ${YOUTUBE_INGESTION_ENABLED:true}
    quota:
      warnings-enabled: true
  spoonacular:
    api-key: ${SPOONACULAR_API_KEY:}
  openai:
    # OpenAI is OPTIONAL - app works without it
    # If not provided, AI features (pose analysis, recipe generation, nutrition insights) are disabled
    enabled: ${OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o
    meal-model: gpt-4o
    timeout-seconds: 60
    cost-per-thousand-tokens: 10.0
    log-usage: true
  anthropic:
    # Anthropic Claude API for food recognition (DEPRECATED - use Gemini instead)
    api-key: ${ANTHROPIC_API_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    # gemini-2.5-flash + thinking disabled ≈ halves calorie error vs 2.0-flash at the same ~4s
    # latency (Nutrition5k benchmark; docs/calorie-accuracy-investigation.md §7).
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    enabled: ${GEMINI_ENABLED:true}
    use-vertex-ai: ${GEMINI_USE_VERTEX_AI:false}
    gcp-project-id: ${GEMINI_GCP_PROJECT_ID:gen-lang-client-0295973830}
    gcp-region: ${GEMINI_GCP_REGION:australia-southeast2}
    # Gemini 2.5 "thinking" budget (tokens). 0 = disabled = fast interactive path (<5s). Thinking
    # added latency without accuracy on this task; only applied to 2.5-family models.
    thinking-budget: ${GEMINI_THINKING_BUDGET:0}
    # Controlled generation (responseSchema) for guaranteed, stably-ordered JSON output.
    # On by default; set to false only if a future model rejects the schema.
    structured-output: ${GEMINI_STRUCTURED_OUTPUT:true}
  nutrition:
    # Geometric portion refinement: when the client sends an absolute LiDAR food volume,
    # correct portion/calories via mass = volume × food-density and blend (geometric mean)
    # with the model's own estimate. No-op without volume. See
    # docs/calorie-accuracy-roadmap-25-to-15.md §10. All values generalize (no per-domain fit).
    physics-refine:
      enabled: ${NUTRITION_PHYSICS_REFINE_ENABLED:true}
      # Per-item (mixed-plate) refinement: assign each on-device depth mask to its food and correct
      # each independently (per-item volume × per-food density). DEFAULT OFF: an N5k eval (n=100,
      # docs §11) measured per-item ~23% vs whole-plate geomean ~16% median calorie APE — per-item
      # loses in every bucket (per-food energy-density multiply amplifies partition noise). Kept
      # behind the flag for the clean-mask / well-separated-plate case; not the shipped default.
      per-item-enabled: ${NUTRITION_PHYSICS_PER_ITEM_ENABLED:false}
      # Learned fusion (docs §12): log y = b + w·log(flash) + (1−w)·log(physics), fit on N5k cafe1
      # (n=100) and validated ZERO-SHOT on cafe2 (n=60): median APE 30.5%→27.7%, signed bias
      # +11.9%→−1.9%, P90 107.7%→76.5% vs the fixed 50:50 geomean. Both are global constants.
      # Weight w on the model's own calorie estimate, [0,1].
      blend-weight: ${NUTRITION_PHYSICS_BLEND_WEIGHT:0.75}
      # Log-space intercept e^b — mostly corrects the vision model's systematic over-estimation.
      # Outside [0.5, 2.0] the service falls back to a neutral 1.0.
      fusion-bias: ${NUTRITION_PHYSICS_FUSION_BIAS:0.862}
      # Geometric (height-map) volume over-reads ~1.32×; divide to a true-volume basis.
      volume-bias: ${NUTRITION_PHYSICS_VOLUME_BIAS:1.32}
      # Clamp the portion correction so a bad volume reading can't wreck an estimate.
      min-scale: ${NUTRITION_PHYSICS_MIN_SCALE:0.4}
      max-scale: ${NUTRITION_PHYSICS_MAX_SCALE:2.5}
  google:
    # Comma-separated allowed audiences for Google ID tokens.
    # Example: GOOGLE_CLIENT_ID=web-client-id.apps.googleusercontent.com,ios-client-id.apps.googleusercontent.com,android-client-id.apps.googleusercontent.com
    client-id: ${GOOGLE_CLIENT_ID:}
  apple:
    # Comma-separated allowed audiences for Apple ID tokens.
    # Example: APPLE_CLIENT_ID=com.elia.aurafitness,org.aurafitness.web
    client-id: ${APPLE_CLIENT_ID:}
    # Required for authorization code exchange and refresh token support.
    # Generate these in Apple Developer > Certificates, Identifiers & Profiles.
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    # Option 1: Inline .p8 private key content (PEM format, including headers).
    # Set via APPLE_PRIVATE_KEY env var with newlines preserved.
    private-key: ${APPLE_PRIVATE_KEY:}
    # Option 2: Path to .p8 private key file on disk.
    # Example: /etc/secrets/AuthKey_ABC123XYZ.p8
    private-key-path: ${APPLE_PRIVATE_KEY_PATH:}
    # Where to redirect after Apple's server-side callback completes.
    # Defaults to https://aurafitness.org if not set.
    web-redirect-uri: ${APPLE_WEB_REDIRECT_URI:}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-needs-to-be-at-least-256-bits-long}
    expiration-days: ${JWT_EXPIRATION_DAYS:30}
  meal-plan:
    cache-ttl-hours: 24
  recipe-generation:
    cache-ttl-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: false

logging:
  level:
    com.fitnessapp.backend: INFO
    org.springframework.security: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  devtools:
    restart:
      enabled: false
  datasource:
    # Dev: Try SUPABASE_JDBC_URL first, fallback to localhost
    url: ${SPRING_DATASOURCE_URL:${SUPABASE_JDBC_URL:jdbc:postgresql://localhost:5432/fitness_mvp}}
    username: ${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:fitnessuser}}
    password: ${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:dev_password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Validate schema matches entities (Flyway manages migrations)
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    repair-on-migrate: true

management:
  endpoint:
    health:
      probes:
        enabled: true

---
# ========================================
# PROD PROFILE (Supabase on Render, no Redis)
# ========================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Standard Spring Boot datasource properties
    # These MUST be set via environment variables on Render:
    #   SPRING_DATASOURCE_URL=jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres
    #   SPRING_DATASOURCE_USERNAME=postgres
    #   SPRING_DATASOURCE_PASSWORD=<password>
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5  # Supabase free tier has connection limits
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  cache:
    type: caffeine  # In-memory cache (Caffeine), no Redis dependency
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate  # Let Flyway manage schema, validate on startup
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true  # Ensure migration checksum consistency
    repair-on-migrate: true

server:
  address: 0.0.0.0
  port: ${PORT:8080}  # Render uses PORT env var
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false  # Disable Redis health check

logging:
  level:
    com.fitnessapp.backend: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Environment Variables for prod profile (Render deployment):
# SPRING_PROFILES_ACTIVE=prod
# JAVA_TOOL_OPTIONS=-Xmx384m -XX:+UseContainerSupport
# SPRING_DATASOURCE_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres
# SPRING_DATASOURCE_USERNAME=postgres.<project-ref>
# SPRING_DATASOURCE_PASSWORD=<your-password>
