name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - "firebase.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        working-directory: frontend
        run: npx expo export --platform web
        env:
          NODE_ENV: production

      - name: Copy public assets
        run: cp -r frontend/public/* frontend/dist/ 2>/dev/null || true

      # SEO/no-JS: prerender static landing content + meta tags into the SPA shell.
      - name: Prerender landing content
        working-directory: frontend
        run: node scripts/prerender-landing.mjs dist/index.html

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: gen-lang-client-0295973830
          channelId: live
