name: HealthKit iOS native compilation
on:
  workflow_dispatch:
    inputs:
      compiled_run_id:
        description: 'Reuse a successful native build run for a simulator launch check'
        required: false
        type: string
  push:
    branches: ['codex/health-native-*']
concurrency:
  group: health-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    if: ${{ inputs.compiled_run_id == '' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            frontend/ios/Pods
            work/health-ios/DerivedData
          key: health-ios-${{ runner.os }}-${{ hashFiles('package-lock.json', 'frontend/ios/Podfile.lock') }}-v1
      - run: bash scripts/build-health-ios.sh
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-ios-native-build-log
          path: |
            work/health-ios/*.log
            frontend/ios/Podfile.lock
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: health-ios-simulator-app
          path: work/health-ios/Metriful-simulator.app.tar.gz
      - run: bash frontend/scripts/smoke-health-ios.sh work/health-ios/Metriful-simulator.app.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-ios-simulator-smoke
          path: |
            work/health-ios-smoke/*.log
            work/health-ios-smoke/*.png
            work/health-ios-smoke/*.plist
  simulator-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compiled_run_id != '' }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: health-ios-simulator-app
          run-id: ${{ inputs.compiled_run_id }}
          github-token: ${{ github.token }}
          path: work/health-ios-smoke
      - run: bash frontend/scripts/smoke-health-ios.sh work/health-ios-smoke/Metriful-simulator.app.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-ios-simulator-smoke
          path: |
            work/health-ios-smoke/*.log
            work/health-ios-smoke/*.png
            work/health-ios-smoke/*.plist
