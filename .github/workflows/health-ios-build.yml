name: HealthKit iOS native compilation
on:
  workflow_dispatch:
  push:
    branches: ['codex/health-native-*']
concurrency:
  group: health-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: bash scripts/build-health-ios.sh
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-ios-native-build-log
          path: |
            work/health-ios/*.log
            frontend/ios/Podfile.lock
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: health-ios-simulator-app
          path: work/health-ios/Metriful-simulator.app.tar.gz
