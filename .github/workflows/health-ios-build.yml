name: HealthKit iOS native compilation
on:
  workflow_dispatch:
  push:
    branches: ['codex/health-native-*']
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: bash scripts/build-health-ios.sh
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-ios-native-build-log
          path: work/health-ios/*.log
