name: Coach and Health integration checks
on:
  push:
    branches: ['codex/health-native-*']
  pull_request:
    paths: ['agent-service/**', 'backend/**', 'frontend/**', 'package.json', 'package-lock.json',
            'infrastructure/docker-compose.agent.yml', '.github/workflows/coach-checks.yml']
  workflow_dispatch:
jobs:
  http-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - run: pip install -r requirements-test.lock
        working-directory: agent-service
      - run: python scripts/verify_http_chain.py --report-dir "${{ runner.temp }}/coach-http"
        working-directory: agent-service
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: coach-http-integration-logs
          path: ${{ runner.temp }}/coach-http/*.log
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.lock
        working-directory: agent-service
      - run: python -m pytest -q
        working-directory: agent-service
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - run: npm ci
      - run: npm run frontend:type-check
      - run: npx jest --runInBand --watch=false coachApi appleHealth CoachScreen AppleHealthScreen
        working-directory: frontend
      - run: npm run ios:check
        working-directory: frontend
      - run: bash gradlew test --tests 'com.fitnessapp.backend.coach.*' --no-daemon
        working-directory: backend
